{% extends "base.html" %}
{% block title %}Cambiar contraseña{% endblock %}
{% block content %}
<div class="page-narrow">
    <div class="page-heading">
        <p class="eyebrow">Seguridad de la cuenta</p>
        <h1>Defina una nueva contraseña</h1>
        <p>Por seguridad, debe cambiar la contraseña temporal antes de continuar.</p>
    </div>
    <form method="post" class="card stacked-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button button-primary" type="submit">Actualizar contraseña</button>
    </form>
</div>
{% endblock %}
